<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Sunch233's blog</title>
    <link rel="stylesheet" type="text/css" href="/css/main.css">

    <script type="text/javascript" src="/js/main.js"></script>
    <script type="text/javascript" src="/js/marked.min.js"></script>

    <script type="text/javascript">
        window.onload = function() {
            var index = getQueryVariable('id');
            if (index === false){
                document.getElementById('posts-div').innerHTML = '<h1>invalid post id!<br>未知文章序号</h1>';
                throw new Error('invalid post id!');
            }
            index = parseInt(index);

            fetch('/posts/posts.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok - json');
                    }
                    return response.json();
                })
                .then(data => {
                    if(!data.hasOwnProperty(index)){
                        document.getElementById('posts-div').innerHTML = '<h1>invalid post id!<br>未知文章序号</h1>';
                        throw new Error('invalid post id!');
                    }
                    document.getElementById('author').innerText ='作者: ' + data[index]['作者'] + ' 创建于: ' + data[index]['创建时间'];
                    document.getElementById('title').innerText = data[index]['文章'];
                    var xhr = new XMLHttpRequest();
                    xhr.open('GET', '/posts/' + index + '.md', false); // false makes it synchronous
                    xhr.send(null);

                    if (xhr.status === 200) {
                        document.getElementById('posts-div').innerHTML = marked.parse(xhr.responseText);
                    } else {
                        console.error('Error fetching the markdown file:', xhr.statusText);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('posts-div').innerHTML =
                        '<p>Error loading data: ' + error.message + '</p>';
                });
        };
    </script>
</head>
<body>
<div class="frame">
    <h1 class="notice">Sunch233's blog —— 闲杂信息集散地</h1>
    <div class="navbar">
        <a href="/">返回首页</a>
        <a href="https://www.axe.ink/">生存斧服务器官网</a>
    </div>

    <div id="author"></div>
    <h2 class="notice" id="title"></h2>
    <div class="alert" id="posts-div"> </div>
    <div class="counter">
        ©2025 Sunch233's blog
    </div>
</div>
</body>
</body>
</html>
